<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python FR / EN / 日本語</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1f;--card:#fff;--bd:#e2e2dc;--ac:#3776ab;--code:#f1f1ec;--ok:#2e8b57}
@media(prefers-color-scheme:dark){:root{--bg:#15171a;--fg:#ececec;--card:#1e2126;--bd:#30343b;--ac:#6cb0e6;--code:#0f1113;--ok:#5fc38a}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,"Segoe UI","Yu Gothic",sans-serif}
.w{max-width:1000px;margin:0 auto;padding:20px 16px 48px;display:grid;grid-template-columns:220px 1fr;gap:20px}
@media(max-width:720px){.w{grid-template-columns:1fr}}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:1.4rem;margin:0}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:6px 12px;border-radius:8px;cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#side{display:flex;flex-direction:column;gap:6px}
#side button{text-align:left}
@media(max-width:720px){#side{flex-direction:row;overflow-x:auto}#side button{white-space:nowrap}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px}
h2{margin:0 0 8px;font-size:1.25rem}
pre{background:var(--code);border-radius:8px;padding:14px;overflow-x:auto;font:14px/1.5 ui-monospace,Consolas,monospace;margin:12px 0}
.ex{border-left:4px solid var(--ac);padding:4px 14px;margin-top:18px}
summary{cursor:pointer;color:var(--ac);margin-top:8px}
.nav{display:flex;justify-content:space-between;margin-top:18px}
button:disabled{opacity:.4;cursor:default}
.cp{float:right;font-size:12px;padding:2px 8px}
.d{color:var(--ok)}
#bar{height:6px;background:var(--bd);border-radius:3px;margin-top:6px}
#bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
</style>
</head>
<body>
<div class="w">
<header><div><h1>🐍 <span id="ttl"></span></h1><div id="bar"><i></i></div></div>
<div class="lang"><button data-l="fr">Français</button> <button data-l="en">English</button> <button data-l="ja">日本語</button></div></header>
<nav id="side"></nav>
<main><div class="card" id="c"></div><div class="nav"><button id="pv"></button><button id="nx"></button></div></main>
</div>
<script>
const CODE=[
`# Save this as hello.py, then in a terminal (Windows):
#   py hello.py
print("Hello, world!")`,
`print("Hello")
print(2 + 3)
print("a", "b", sep="-")`,
`name = "Alice"
age = 16
height = 1.68
is_student = True
print(name, age, type(age))`,
`a, b = 7, 2
print(a + b, a - b, a * b)
print(a / b, a // b, a % b, a ** b)
name = input("Name? ")
n = int(input("Number? "))
print("Hi", name, n * 2)`,
`s = "Python"
print(len(s), s[0], s[-1], s[1:4])
print(s.upper(), s.lower(), s.replace("P", "J"))
age = 16
print(f"I am {age} years old")`,
`age = int(input("Age? "))
if age >= 18:
    print("Adult")
elif age >= 13:
    print("Teen")
else:
    print("Child")
print(age > 10 and age < 20)`,
`for i in range(5):
    print(i)

n = 3
while n > 0:
    print(n)
    n -= 1

for i in range(10):
    if i == 3:
        continue
    if i == 6:
        break
    print(i)`,
`nums = [5, 2, 9]
nums.append(1)
nums.sort()
print(nums, len(nums), nums[0], sum(nums))
for x in nums:
    print(x)
print([x * 2 for x in nums])`,
`person = {"name": "Alice", "age": 16}
person["city"] = "Nancy"
print(person["name"], person.get("zip", "?"))
for key, value in person.items():
    print(key, value)`,
`def square(x):
    return x * x

def greet(name="world"):
    print("Hello", name)

print(square(4))
greet()
greet("Alice")`,
`try:
    n = int(input("Number? "))
    print(10 / n)
except ValueError:
    print("Not a number")
except ZeroDivisionError:
    print("No zero!")

with open("notes.txt", "w") as f:
    f.write("line 1\n")
with open("notes.txt") as f:
    for line in f:
        print(line.strip())`];
const SOL=[
`print("My first program")`,
`print("Alice", 16)`,
`x = 4
y = 9
print(x + y)`,
`n = int(input("Number? "))
print(n * 2, n % 2)`,
`w = input("Word? ")
print(w[::-1])`,
`n = int(input("Number? "))
if n % 2 == 0:
    print("even")
else:
    print("odd")`,
`for i in range(1, 11):
    print(7 * i)`,
`nums = [4, 8, 1]
total = 0
for x in nums:
    total += x
print(total)`,
`d = {"one": 1, "two": 2}
d["three"] = 3
print(d["two"], len(d))`,
`def biggest(a, b):
    if a > b:
        return a
    return b

print(biggest(3, 8))`,
`try:
    with open("nope.txt") as f:
        print(f.read())
except FileNotFoundError:
    print("File not found")`];
const T={
fr:{ttl:"Apprendre Python – cours complet",prev:"← Précédent",next:"Suivant →",ex:"Exercice",sol:"Voir la solution",cp:"Copier",ok:"Copié !",done:"Marquer comme terminé",undone:"✓ Terminé",
L:[
["Installer et lancer","Télécharge Python sur python.org (coche « Add Python to PATH » à l'installation). Écris ton code dans un fichier .py avec un éditeur (VS Code, IDLE…), puis lance-le avec py nom.py dans un terminal. Les lignes commençant par # sont des commentaires, ignorés par Python.","Crée un fichier test.py qui affiche une phrase, puis lance-le."],
["Afficher du texte","Un programme est une suite d'instructions exécutées de haut en bas. print() affiche à l'écran. Le texte va entre guillemets, pas les nombres. Plusieurs valeurs se séparent par des virgules.","Affiche ton prénom avec print()."],
["Les variables","Une variable est une boîte nommée contenant une valeur, créée avec =. Types courants : str (texte), int (entier), float (décimal), bool (True/False). type() donne le type. Choisis des noms clairs en minuscules_avec_underscore.","Range deux nombres dans des variables et affiche leur somme."],
["Opérateurs et saisie","+ - * / calculent ; // donne le quotient entier, % le reste, ** la puissance. input() lit ce que tape l'utilisateur, toujours sous forme de texte : convertis avec int() ou float().","Demande un nombre et affiche son double et son reste par 2."],
["Chaînes de caractères","Une chaîne s'indexe comme une suite : s[0] est le premier caractère, s[-1] le dernier, s[1:4] une tranche. Méthodes utiles : upper(), lower(), replace(), split(). Les f-strings f\"...{x}...\" insèrent des valeurs dans le texte.","Demande un mot et affiche-le à l'envers (indice : [::-1])."],
["Les conditions","if / elif / else choisissent quoi exécuter. Le bloc est marqué par les deux-points et l'indentation (4 espaces). Comparaisons : == != < > <= >=. Combine avec and, or, not.","Demande un nombre et dis s'il est pair ou impair."],
["Les boucles","for répète un nombre connu de fois (range(5) donne 0 à 4). while répète tant qu'une condition est vraie : fais-la évoluer, sinon boucle infinie. break sort de la boucle, continue passe au tour suivant.","Affiche la table de multiplication de 7 (7×1 à 7×10)."],
["Les listes","Une liste [..] contient plusieurs valeurs, modifiables. append() ajoute, sort() trie, len() compte, sum() additionne. Une compréhension de liste [x*2 for x in nums] construit une nouvelle liste en une ligne.","Calcule la somme d'une liste avec une boucle for (sans sum)."],
["Les dictionnaires","Un dictionnaire {clé: valeur} associe des valeurs à des clés. On lit avec d[clé] ou d.get(clé, défaut), on ajoute en affectant d[clé] = valeur, on parcourt avec .items().","Crée un dictionnaire, ajoute une clé et affiche sa taille."],
["Les fonctions","Une fonction, définie avec def, regroupe du code réutilisable. Elle reçoit des paramètres (avec valeurs par défaut possibles) et renvoie un résultat avec return. Sans return, elle renvoie None.","Écris une fonction qui renvoie le plus grand de deux nombres."],
["Erreurs et fichiers","try / except attrape les erreurs (ValueError, ZeroDivisionError, FileNotFoundError…) au lieu de faire planter le programme. with open(nom, mode) lit ('r') ou écrit ('w') un fichier et le referme tout seul. Bravo, tu connais les bases : essaie maintenant un vrai petit projet !","Ouvre un fichier inexistant et affiche un message d'erreur clair."]]},
en:{ttl:"Learn Python – full course",prev:"← Previous",next:"Next →",ex:"Exercise",sol:"Show solution",cp:"Copy",ok:"Copied!",done:"Mark as done",undone:"✓ Done",
L:[
["Install and run","Download Python from python.org (tick \"Add Python to PATH\" during setup). Write code in a .py file with an editor (VS Code, IDLE…), then run it with py name.py in a terminal. Lines starting with # are comments, ignored by Python.","Create test.py that prints a sentence, then run it."],
["Displaying text","A program is a list of instructions run from top to bottom. print() shows output on screen. Text goes in quotes, numbers don't. Separate several values with commas.","Print your first name with print()."],
["Variables","A variable is a named box holding a value, created with =. Common types: str (text), int (whole number), float (decimal), bool (True/False). type() tells you the type. Use clear lowercase_with_underscores names.","Store two numbers in variables and print their sum."],
["Operators and input","+ - * / calculate; // gives the whole-number quotient, % the remainder, ** the power. input() reads what the user types, always as text: convert with int() or float().","Ask for a number and print its double and its remainder by 2."],
["Strings","A string is indexed like a sequence: s[0] is the first character, s[-1] the last, s[1:4] a slice. Useful methods: upper(), lower(), replace(), split(). f-strings f\"...{x}...\" insert values into text.","Ask for a word and print it reversed (hint: [::-1])."],
["Conditions","if / elif / else choose what to run. A block is marked by a colon and indentation (4 spaces). Comparisons: == != < > <= >=. Combine with and, or, not.","Ask for a number and say whether it is even or odd."],
["Loops","for repeats a known number of times (range(5) gives 0 to 4). while repeats while a condition is true: make it change, or the loop never ends. break leaves the loop, continue skips to the next round.","Print the multiplication table of 7 (7×1 to 7×10)."],
["Lists","A list [..] holds several changeable values. append() adds, sort() sorts, len() counts, sum() adds up. A list comprehension [x*2 for x in nums] builds a new list in one line.","Compute a list's sum with a for loop (no sum)."],
["Dictionaries","A dictionary {key: value} maps keys to values. Read with d[key] or d.get(key, default), add by assigning d[key] = value, loop with .items().","Create a dictionary, add a key and print its size."],
["Functions","A function, defined with def, groups reusable code. It takes parameters (defaults allowed) and sends back a result with return. Without return, it gives None.","Write a function that returns the larger of two numbers."],
["Errors and files","try / except catches errors (ValueError, ZeroDivisionError, FileNotFoundError…) instead of crashing. with open(name, mode) reads ('r') or writes ('w') a file and closes it for you. Well done, you know the basics: now try a real small project!","Open a missing file and print a clear error message."]]},
ja:{ttl:"Pythonを学ぼう – 完全コース",prev:"← 前へ",next:"次へ →",ex:"練習問題",sol:"解答を見る",cp:"コピー",ok:"コピーしました",done:"完了にする",undone:"✓ 完了",
L:[
["インストールと実行","python.org から Python をダウンロードします（インストール時に「Add Python to PATH」にチェック）。エディタ（VS Code、IDLE など）で .py ファイルにコードを書き、ターミナルで py ファイル名.py と入力して実行します。# で始まる行はコメントで、Python は無視します。","test.py を作って一文を表示し、実行してください。"],
["文字を表示する","プログラムは上から下へ順に実行される命令の集まりです。print() は画面に表示します。文字列は引用符で囲み、数値は囲みません。複数の値はカンマで区切ります。","print() で自分の名前を表示してください。"],
["変数","変数は名前のついた「箱」で、= で作ります。主な型：str（文字列）、int（整数）、float（小数）、bool（True/False）。type() で型を調べられます。名前は小文字とアンダースコアで分かりやすく付けましょう。","2つの数を変数に入れ、その合計を表示してください。"],
["演算子と入力","+ - * / で計算します。// は整数の商、% は余り、** はべき乗です。input() はユーザーの入力を読み取りますが常に文字列なので、int() や float() で変換します。","数を入力してもらい、その2倍と2で割った余りを表示してください。"],
["文字列","文字列は並びとして扱えます。s[0] は最初の文字、s[-1] は最後、s[1:4] は一部分（スライス）です。便利なメソッド：upper()、lower()、replace()、split()。f文字列 f\"...{x}...\" で値を文に埋め込めます。","単語を入力してもらい、逆順に表示してください（ヒント：[::-1]）。"],
["条件分岐","if / elif / else で実行する内容を選びます。ブロックはコロンとインデント（半角スペース4つ）で示します。比較：== != < > <= >=。and、or、not で組み合わせられます。","数を入力してもらい、偶数か奇数かを表示してください。"],
["繰り返し","for は決まった回数繰り返します（range(5) は 0〜4）。while は条件が真の間繰り返します。条件が変わらないと無限ループになります。break でループを抜け、continue で次の回へ進みます。","7の段（7×1〜7×10）を表示してください。"],
["リスト","リスト [..] は変更可能な複数の値をまとめます。append() で追加、sort() で並べ替え、len() で個数、sum() で合計。リスト内包表記 [x*2 for x in nums] で新しいリストを1行で作れます。","for ループでリストの合計を求めてください（sum は使わない）。"],
["辞書","辞書 {キー: 値} はキーと値を対応づけます。d[キー] または d.get(キー, 既定値) で読み、d[キー] = 値 で追加し、.items() で繰り返します。","辞書を作り、キーを1つ追加して要素数を表示してください。"],
["関数","関数は def で定義し、再利用できるコードをまとめます。引数（既定値も可）を受け取り、return で結果を返します。return がなければ None を返します。","2つの数のうち大きい方を返す関数を書いてください。"],
["エラー処理とファイル","try / except は、プログラムを止めずにエラー（ValueError、ZeroDivisionError、FileNotFoundError など）を捕まえます。with open(名前, モード) でファイルを読み（'r'）書き（'w'）、自動で閉じます。基本は以上です。次は小さな実用プロジェクトに挑戦しましょう！","存在しないファイルを開き、分かりやすいエラーメッセージを表示してください。"]]}};
const N=CODE.length;
let lang="fr",i=0,done=new Set();
try{lang=localStorage.getItem("py-lang")||(navigator.language||"fr").slice(0,2);done=new Set(JSON.parse(localStorage.getItem("py-done")||"[]"))}catch(e){}
if(!T[lang])lang="en";
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const save=()=>{try{localStorage.setItem("py-lang",lang);localStorage.setItem("py-done",JSON.stringify([...done]))}catch(e){}};
function render(){
 const t=T[lang],l=t.L[i];
 document.documentElement.lang=lang;document.title="Python – "+t.ttl;
 $("#ttl").textContent=t.ttl;
 $("#bar i").style.width=(done.size/N*100)+"%";
 document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
 $("#side").innerHTML=t.L.map((x,k)=>`<button data-k="${k}" class="${k===i?"on":""}">${done.has(k)?'<span class="d">✓</span> ':""}${k?k+". ":"0. "}${x[0]}</button>`).join("");
 $("#c").innerHTML=`<h2>${l[0]}</h2><p>${l[1]}</p><pre><button class="cp" data-c="${i}">${t.cp}</button><code>${esc(CODE[i])}</code></pre>
 <div class="ex"><b>${t.ex}</b><p>${l[2]}</p><details><summary>${t.sol}</summary><pre><code>${esc(SOL[i])}</code></pre></details></div>
 <p><button data-d="1" class="${done.has(i)?"on":""}">${done.has(i)?t.undone:t.done}</button></p>`;
 $("#pv").textContent=t.prev;$("#nx").textContent=t.next;
 $("#pv").disabled=i===0;$("#nx").disabled=i===N-1;
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.l){lang=b.dataset.l;save();render()}
 else if(b.dataset.k){i=+b.dataset.k;render();scrollTo(0,0)}
 else if(b.id==="pv"&&i>0){i--;render();scrollTo(0,0)}
 else if(b.id==="nx"&&i<N-1){i++;render();scrollTo(0,0)}
 else if(b.dataset.d){done.has(i)?done.delete(i):done.add(i);save();render()}
 else if(b.dataset.c){const x=CODE[+b.dataset.c];(navigator.clipboard?navigator.clipboard.writeText(x):Promise.reject()).then(()=>{b.textContent=T[lang].ok}).catch(()=>{})}
});
render();
</script>
</body>
</html>
